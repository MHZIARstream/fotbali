<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فوتبالی ⚽</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f2f5f7;
  color:#17202a;
  transition:.3s;
}

body.dark{
  background:#101719;
  color:#f5f5f5;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:linear-gradient(135deg,#087f45,#0bb566);
  color:white;
  box-shadow:0 4px 18px #0003;
}

.top{
  max-width:1200px;
  margin:auto;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.liveDot{
  width:9px;
  height:9px;
  display:inline-block;
  background:#ff3030;
  border-radius:50%;
  margin-left:5px;
}

nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  gap:7px;
  padding:0 12px 12px;
  overflow-x:auto;
}

nav button{
  white-space:nowrap;
  background:#ffffff20;
  color:white;
  padding:10px 14px;
  border-radius:12px;
}

nav button.active,
nav button:hover{
  background:white;
  color:#087f45;
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px 12px 70px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  background:linear-gradient(135deg,#102d23,#087f45);
  color:white;
  border-radius:22px;
  padding:28px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 8px;
}

.hero p{
  margin:0;
  color:#d8f4e5;
}

.panel,
.card,
.match,
.teamCard,
.playerCard,
.newsCard{
  background:white;
  border:1px solid #e5eaed;
  border-radius:18px;
  padding:16px;
  box-shadow:0 4px 18px #0000000c;
}

.dark .panel,
.dark .card,
.dark .match,
.dark .teamCard,
.dark .playerCard,
.dark .newsCard{
  background:#182124;
  border-color:#293438;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.stat{
  font-size:28px;
  color:#087f45;
  font-weight:bold;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}

input,
select{
  padding:12px;
  border:1px solid #d7dfe3;
  border-radius:12px;
  background:white;
  outline:none;
}

.dark input,
.dark select{
  background:#182124;
  color:white;
  border-color:#344248;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
}

.tabs button{
  padding:10px 15px;
  border-radius:12px;
  background:#e7ecef;
}

.tabs button.active{
  background:#087f45;
  color:white;
}

.match{
  margin-bottom:13px;
  transition:.2s;
  cursor:pointer;
}

.match:hover{
  transform:translateY(-2px);
}

.matchHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.league{
  font-weight:bold;
}

.status{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#edf1f3;
}

.status.live{
  background:#ffe5e3;
  color:#d72c22;
}

.teams{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  text-align:center;
  gap:10px;
}

.team{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  font-weight:bold;
}

.team.reverse{
  flex-direction:row-reverse;
}

.teamLogo{
  width:40px;
  height:40px;
  object-fit:contain;
}

.score{
  font-size:25px;
  font-weight:bold;
}

.details{
  display:none;
  border-top:1px solid #e8edef;
  margin-top:15px;
  padding-top:15px;
}

.details.open{
  display:block;
}

.detailTeams{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:35px;
  margin-bottom:20px;
}

.detailTeam{
  text-align:center;
  font-weight:bold;
}

.detailTeam img{
  width:65px;
  height:65px;
  display:block;
  object-fit:contain;
  margin:auto auto 8px;
}

.eventList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.event{
  display:grid;
  grid-template-columns:45px 35px 1fr 90px;
  align-items:center;
  gap:8px;
  background:#f6f8f9;
  padding:10px;
  border-radius:12px;
}

.dark .event,
.dark .statRow,
.dark .lineup{
  background:#202b2f;
}

.eventIcon{
  font-size:20px;
  text-align:center;
}

.eventPlayer{
  display:flex;
  align-items:center;
  gap:8px;
}

.miniLogo{
  width:28px;
  height:28px;
  object-fit:contain;
}

.eventTeam{
  font-size:11px;
  color:#71808a;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0 20px;
}

.statRow{
  background:#f6f8f9;
  padding:11px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

.lineups{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.lineup{
  background:#f6f8f9;
  padding:12px;
  border-radius:14px;
}

.playerRow{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #dde3e6;
}

.rating{
  margin-right:auto;
  background:white;
  padding:3px 7px;
  border-radius:7px;
  font-size:11px;
}

.tableWrap{
  overflow:auto;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  text-align:center;
  border-bottom:1px solid #e7ecef;
}

th{
  background:#eef3f5;
}

.dark th{
  background:#202b2f;
}

.form{
  display:flex;
  justify-content:center;
  gap:4px;
}

.form span{
  width:21px;
  height:21px;
  color:white;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:10px;
}

.win{background:#19a35c}
.draw{background:#e3a300}
.loss{background:#db4038}

.teamGrid,
.playerGrid,
.newsGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.teamCard,
.playerCard,
.newsCard{
  text-align:center;
}

.teamCard .teamLogo{
  width:70px;
  height:70px;
  margin:0 auto 10px;
  display:block;
}

.playerAvatar{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#e9eff1;
  margin:auto;
  display:grid;
  place-items:center;
  font-size:30px;
}

.favorite{
  background:#fff2bf;
  color:#886600;
  padding:7px 10px;
  border-radius:10px;
}

.actionBtn{
  background:#087f45;
  color:white;
  padding:9px 13px;
  border-radius:10px;
}

.muted{
  color:#77858d;
  font-size:13px;
}

footer{
  text-align:center;
  padding:30px;
  color:#7b878d;
}

@media(max-width:800px){

  .grid,
  .teamGrid,
  .playerGrid,
  .newsGrid{
    grid-template-columns:1fr 1fr;
  }

  .lineups{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .grid,
  .teamGrid,
  .playerGrid,
  .newsGrid{
    grid-template-columns:1fr;
  }

  .teams{
    grid-template-columns:1fr 65px 1fr;
  }

  .event{
    grid-template-columns:38px 30px 1fr;
  }

  .eventType{
    display:none;
  }

  .detailTeams{
    gap:18px;
  }

  .detailTeam img{
    width:50px;
    height:50px;
  }

}
</style>
</head>

فردا
</button>

</button>

</div>

<input
id="gameSearch"

<option>Premier League</option>

<option>Serie A</option>

<option>Bundesliga</option>

<option>Ligue 1</option>

</select>

</div>

<div id="gamesList"></div>

</section>


<!-- لیگ ها -->

<tbody id="leagueTable"></tbody>

</table>

</div>

</div>

</section>


<!-- تیم ها -->
<section id="teams" class="page">

<h2>👕 تیم‌ها</h2>

<div class="toolbar">

<input
id="teamSearch"
placeholder="جستجوی تیم..."
oninput="renderTeams()">

</div>

<div id="teamGrid" class="teamGrid"></div>

</section>


<!-- بازیکنان -->
<section id="players" class="page">

<h2>👤 بازیکنان</h2>

<div class="toolbar">

<input
id="playerSearch"
placeholder="جستجوی بازیکن یا تیم..."
oninput="renderPlayers()">

</div>

<div id="playerGrid" class="playerGrid"></div>

</section>


<!-- اخبار -->
<section id="news" class="page">

<h2>📰 اخبار فوتبال</h2>

<div class="toolbar">

<input
id="newsSearch"
placeholder="جستجوی خبر..."
oninput="renderNews()">

</div>

<div id="newsGrid" class="newsGrid"></div>

</section>

</main>

const menu = [

["home","🏠 خانه"],

["games","⚽ بازی‌ها"],

["leagues","🏆 لیگ‌ها"],

["teams","👕 تیم‌ها"],

["players","👤 بازیکنان"],

["news","📰 اخبار"]

];

document.getElementById("nav").innerHTML = menu.map((x,i)=>`

<button
class="${i===0?"active":""}"
onclick="showPage('${x[0]}',this)">

${x[1]}

</button>

`).join("");


function showPage(id,button){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   لوگو
========================= */

function logo(team,className="teamLogo"){

return `

<img

class="${className}"

src="${teams[team].logo}"

alt="${teams[team].name}"

loading="lazy"

onerror="this.onerror=null;this.src='${FALLBACK}'">

`;

}


/* =========================
   کارت بازی
========================= */

function teamBox(id,reverse=false){

return `

<div class="team ${reverse?"reverse":""}">

${logo(id)}

<span>${teams[id].name}</span>

</div>

`;

}


function matchCard(m){

return `

<div class="match">

<div
class="matchHead"
onclick="toggleDetails(${m.id})">

<span class="league">
${m.league}
</span>

<span class="status ${m.status==="زنده"?"live":""}">

${m.status==="زنده"?"🔴 ":""}

${m.time}

</span>

</div>


<div
class="teams"
onclick="toggleDetails(${m.id})">

${teamBox(m.a)}

<div class="score">
${m.score}
</div>

${teamBox(m.b,true)}

</div>


<div
id="details-${m.id}"
class="details">

${details(m)}

</div>

</div>

`;

}

return `

</div>

</div>

`;

}).join("")}

</div>

`;

}

</span>

</div>

`).join("")}

</div>

`;

}
